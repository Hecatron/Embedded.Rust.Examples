# cargo embed configuration file
# Full default settings can be seen under
# https://github.com/probe-rs/probe-rs/blob/master/probe-rs-tools/src/bin/probe-rs/cmd/cargo_embed/config/default.toml

[default.probe]
protocol = "Swd"

[default.flashing]
enabled = true
restore_unwritten_bytes = false
do_chip_erase = false

[default.reset]
enabled = true
halt_afterwards = false

[default.general]
chip = "STM32F767ZI"
chip_descriptions = []
log_level = "WARN"
connect_under_reset = false

[default.rtt]
enabled = false
timeout = 3000
show_timestamps = true
log_enabled = false
log_path = "./logs"

[default.gdb]
enabled = false
gdb_connection_string = "127.0.0.1:1337"
