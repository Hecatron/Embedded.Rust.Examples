site_name: Embedded Rust Examples
site_url: https://Hecatron.github.io/Embedded.Rust.Examples
repo_url: https://github.com/Hecatron/Embedded.Rust.Examples.git

theme:
  name: material
  features:
    - tabs
    - navigation.indexes 

  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  font:
    text: SpaceGrotesk
    code: SpaceMono
  favicon: assets/favicon.ico
  icon:
    logo: logo



plugins:
  - search
  - emailprotect
  - mkdocs-video
  - tags
  - git-revision-date-localized



markdown_extensions:
  - pymdownx.highlight:
      use_pygments: false
  - attr_list
  - md_in_html
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.blocks.admonition
  - pymdownx.blocks.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_javascript:

    # HighlightJS for coloring in code blocks - https://highlightjs.org/static/demo/
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/10.1.2/highlight.min.js
  - assets/js/hljs/config.js

    # Sortable tables
  - https://cdnjs.cloudflare.com/ajax/libs/tablesort/5.2.1/tablesort.min.js
  - assets/js/sorttable/config.js

extra_css:
    # HighlightJS for coloring in code blocks - https://highlightjs.org/static/demo/
  - https://cdnjs.cloudflare.com/ajax/libs/highlight.js/10.1.2/styles/atelier-dune-light.min.css
  - stylesheets/extra.css
